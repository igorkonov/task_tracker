<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Современный Task Tracker для управления задачами" />
  <meta name="keywords" content="задачи, планирование, управление проектами, канбан" />
  <meta name="author" content="Task Tracker App" />

  <!-- Предзагрузка шрифтов -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Иконки -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.css" rel="stylesheet">

  <title>Task Tracker - Управление задачами</title>

  <style>
    /* Критичные стили для предотвращения мерцания */
    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* Индикатор загрузки */
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Скрыть загрузчик когда React загрузился */
    .app-loaded .initial-loader {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Индикатор загрузки -->
    <div class="initial-loader">
      <div class="loader-spinner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Скрыть загрузчик когда DOM готов
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.documentElement.classList.add('app-loaded');
      }, 1000);
    });

    // Обработка ошибок
    window.addEventListener('error', (e) => {
      console.error('Global error:', e.error);
    });

    // Service Worker для PWA (опционально)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
